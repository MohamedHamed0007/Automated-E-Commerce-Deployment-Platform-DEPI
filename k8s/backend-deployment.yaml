apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment
  namespace: shipsphere

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend

        image: mostafahazem944/shipspherebe:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 3000

        envFrom:
        - secretRef:
            name: backend-secret

        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"