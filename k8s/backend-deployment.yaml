apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment
  namespace: shipsphere

spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend

        image: mostafahazem944/shipspherebe:latest

        ports:
        - containerPort: 3000

        resources:
          requests:
            cpu: "200m"
          limits:
            cpu: "500m"
