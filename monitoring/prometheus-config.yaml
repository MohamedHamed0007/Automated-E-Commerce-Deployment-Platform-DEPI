apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-config
  namespace: shipsphere

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'admin-nextt'

        metrics_path: /api/v1/metrics

        static_configs:
          - targets:
              - 35.243.234.58:80