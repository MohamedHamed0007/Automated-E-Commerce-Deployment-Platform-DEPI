name: Build & Push Images
 
on:
  push:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Login Docker Hub
    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # Backend
    - name: Build & Push Backend
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/shipspherebe:v${{ github.run_number }} -f backend/Dockerfile backend
        docker push ${{ secrets.DOCKER_USERNAME }}/shipspherebe:v${{ github.run_number }}

    # Admin
    - name: Build & Push Admin
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/shipspherean:v${{ github.run_number }} -f admin-next/Dockerfile admin-next
        docker push ${{ secrets.DOCKER_USERNAME }}/shipspherean:v${{ github.run_number }}

    # Frontend ✅
    - name: Build & Push Frontend
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/shipspherefe:v${{ github.run_number }} -f frontend/Dockerfile frontend
        docker push ${{ secrets.DOCKER_USERNAME }}/shipspherefe:v${{ github.run_number }}
