name: Build Push & Deploy

on:
  push:
    branches:
      - mostafa-hazem

permissions:
  contents: read
  id-token: write

jobs:

  build-deploy:
    runs-on: ubuntu-latest

    steps:

    # -----------------------------
    # Checkout Repository
    # -----------------------------
    - name: Checkout code
      uses: actions/checkout@v4

    # -----------------------------
    # Docker Hub Login
    # -----------------------------
    - name: Login to Docker Hub
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
        -u "${{ secrets.DOCKER_USERNAME }}" \
        --password-stdin

    # -----------------------------
    # Build & Push Backend
    # -----------------------------
    - name: Build & Push Backend
      run: |
        docker build \
        -t ${{ secrets.DOCKER_USERNAME }}/shipspherebe:latest \
        -f backend/Dockerfile backend

        docker push ${{ secrets.DOCKER_USERNAME }}/shipspherebe:latest

    # -----------------------------
    # Build & Push Admin
    # -----------------------------
    - name: Build & Push Admin
      run: |
        docker build \
        -t ${{ secrets.DOCKER_USERNAME }}/shipspherean:latest \
        -f admin-next/Dockerfile admin-next

        docker push ${{ secrets.DOCKER_USERNAME }}/shipspherean:latest

    # -----------------------------
    # Build & Push Frontend
    # -----------------------------
    - name: Build & Push Frontend
      run: |
        docker build \
        -t ${{ secrets.DOCKER_USERNAME }}/shipspherefe:latest \
        -f frontend/Dockerfile frontend

        docker push ${{ secrets.DOCKER_USERNAME }}/shipspherefe:latest

    # -----------------------------
    # Authenticate to GCP
    # -----------------------------
    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

    # -----------------------------
    # Setup Google Cloud SDK
    # -----------------------------
    - name: Setup Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        install_components: 'gke-gcloud-auth-plugin'

    # -----------------------------
    # Connect to GKE Cluster
    # -----------------------------
    - name: Connect to GKE Cluster
      env:
        USE_GKE_GCLOUD_AUTH_PLUGIN: "True"

      run: |
        gcloud container clusters get-credentials shipsphere-cluster \
        --region us-east1 \
        --project project-824bb343-05b2-4a8e-87d

    # -----------------------------
    # Create Namespace if Not Exists
    # -----------------------------
    - name: Create Namespace
      run: |
        kubectl create namespace shipsphere \
        --dry-run=client -o yaml | kubectl apply -f -

    # -----------------------------
    # Deploy Kubernetes Manifests
    # -----------------------------
    - name: Deploy Kubernetes Manifests
      env:
        USE_GKE_GCLOUD_AUTH_PLUGIN: "True"

      run: |
        kubectl apply -f k8s/

    # -----------------------------
    # Rolling Restart
    # -----------------------------
    - name: Rolling Restart Deployments
      run: |
        kubectl rollout restart deployment/frontend-deployment -n shipsphere
        kubectl rollout restart deployment/backend-deployment -n shipsphere
        kubectl rollout restart deployment/admin-deployment -n shipsphere

    # -----------------------------
    # Verify Kubernetes Resources
    # -----------------------------
    - name: Verify Deployments
      run: |
        kubectl get pods -n shipsphere
        kubectl get svc -n shipsphere
        kubectl get hpa -n shipsphere