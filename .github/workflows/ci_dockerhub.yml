name: Build and Push Docker Images

on:
  push:
    branches:
      - main

env:
  REGISTRY: docker.io
  IMAGE_TAG: latest

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - backend
          - frontend
          - admin-next

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${{ env.IMAGE_TAG }} \
            ./${{ matrix.service }}

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}