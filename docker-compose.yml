services:

  backend:
    build: ./backend
    container_name: shipsphere-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/env/.env.dev
    environment:
      NODE_ENV: development
      PORT: 3000
      ALLOWED_ORIGINS: http://localhost,http://localhost:5173,http://shipsphere.com,https://shipsphere.com,https://admin.shipsphere.com
      FRONTEND_URL: http://localhost
    restart: unless-stopped

  admin:
    build:
      context: ./admin-next
      args:
        NEXT_PUBLIC_API_URL: http://backend:3000/api/v1
        NEXT_PUBLIC_INTERNAL_API_URL: http://backend:3000
    container_name: shipsphere-admin
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      NEXT_PUBLIC_INTERNAL_API_URL: http://backend:3000
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: shipsphere-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
      - admin
    restart: unless-stopped